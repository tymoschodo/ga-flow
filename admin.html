.sif-begin{color:#00e87a;border-color:#00e87a;background:rgba(0,232,122,.08)}.sif-begin:hover{background:rgba(0,232,122,.16)}.sif-begin:disabled{opacity:.3;cursor:not-allowed}
.sif-fn{color:#ff3c3c;border-color:#ff3c3c;background:rgba(255,60,60,.06)}.sif-fn:hover{background:rgba(255,60,60,.14)}.sif-fn:disabled{opacity:.3;cursor:not-allowed}

/* TOASTS */
.toasts{position:fixed;top:16px;right:16px;z-index:999;display:flex;flex-direction:column;gap:6px;pointer-events:none}

.toast.ok{border-left:2px solid var(--green)}.toast.warn{border-left:2px solid var(--amber)}.toast.err{border-left:2px solid var(--red)}
@keyframes tIn{from{transform:translateX(24px);opacity:0}to{transform:translateX(0);opacity:1}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}

.analysis-item{padding:7px 10px;border-radius:3px;margin-bottom:4px;font-size:10px;line-height:1.6;font-family:var(--mono)}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef,useMemo} = React;

/* ── FIREBASE ─────────────────────────────────────────────────── */
firebase.initializeApp({
  apiKey:"AIzaSyBzo6qVmam_u-H2asl3GIPRU_JBbMCPN9g",
  authDomain:"general-anesthesia-cf511.firebaseapp.com",
  databaseURL:"https://general-anesthesia-cf511-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"general-anesthesia-cf511",
  storageBucket:"general-anesthesia-cf511.firebasestorage.app",
  messagingSenderId:"839292271507",
  appId:"1:839292271507:web:42a6028e0ff992afb50666"
});
const fdb = firebase.database();
const dbSet=(p,v)=>fdb.ref(p).set(v);
const dbUpdate=(p,v)=>fdb.ref(p).update(v);
const dbGet=p=>fdb.ref(p).once('value').then(s=>s.val());
const dbTx=(p,fn)=>fdb.ref(p).transaction(fn);

/* ── DEFAULT CONFIG ───────────────────────────────────────────── */
const DEFAULT_CONFIG = {
  stations:{
    s1:{id:'s1',num:1,name:'Station 01',activeRoles:1,observerRoles:0,dur:240,enabled:true,
        messageActive:'Please lie on the table. Your procedure will begin shortly.',
        messageObserver:'You are about to observe a procedure. Please do not interfere.'},
    s2:{id:'s2',num:2,name:'Station 02',activeRoles:1,observerRoles:0,dur:300,enabled:true,
        messageActive:'Please take your position. The session is beginning.',
        messageObserver:'Please observe quietly.'},
    s3:{id:'s3',num:3,name:'Waiting Room',activeRoles:0,observerRoles:10,dur:0,enabled:true,isWaiting:true,
        messageActive:'',messageObserver:'Please take a seat and wait for your appointment.'},
    s4:{id:'s4',num:4,name:'Station 04',activeRoles:1,observerRoles:3,dur:240,enabled:true,
        messageActive:'Please lie on the table. You will be undergoing a procedure.',
        messageObserver:'You are about to witness a procedure. Please do not interfere.'},
    s5:{id:'s5',num:5,name:'Station 05',activeRoles:1,observerRoles:3,dur:240,enabled:true,
        messageActive:'You are the patient. Please follow the performer\'s instructions.',
        messageObserver:'Observe the session. Please remain silent.'},
    s6:{id:'s6',num:6,name:'Station 06',activeRoles:2,observerRoles:13,dur:360,enabled:true,
        messageActive:'Please take your position at the center of the room.',
        messageObserver:'Find a place to stand. The session is beginning.'},
    s7:{id:'s7',num:7,name:'Station 07',activeRoles:0,observerRoles:30,dur:0,enabled:true,isFinal:true,
        messageActive:'',messageObserver:'You have arrived at the final location. Please remain here.'},
  },
  transit:{
    's3-s1':45,'s3-s2':45,'s3-s4':120,'s3-s5':120,
    's1-s2':60,'s1-s6':120,'s2-s4':120,'s2-s5':120,
    's4-s5':180,'s4-s6':120,'s5-s1':120,'s5-s6':120,'s6-s7':60,
  },
  paths:{
    A:{label:'A',seq:['s3','s1','s2','s4','s5','s6','s7']},
    B:{label:'B',seq:['s3','s4','s2','s5','s1','s6','s7']},
    C:{label:'C',seq:['s3','s5','s1','s2','s4','s6','s7']},
  },
  maxParticipants:30,
  regInterval:60,
};

/* ── HELPERS ──────────────────────────────────────────────────── */
const now=()=>Date.now();
const fmtSec=s=>{s=Math.max(0,Math.round(s));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
const getT=(transit,a,b)=>transit?.[`${a}-${b}`]||transit?.[`${b}-${a}`]||90;
const stCap=(s)=>(s.activeRoles||0)+(s.observerRoles||0);

/* ── ROLE ASSIGNMENT ──────────────────────────────────────────── */
function assignRoles(participants, station){
  // participants: array of {id, rolePreference}
  // Returns: {[pid]: 'active'|'observer'}
  const activeNeeded = station.activeRoles || 0;
  const willing = participants.filter(p=>p.rolePreference==='active');
  const unwilling = participants.filter(p=>p.rolePreference!=='active');

  // Shuffle willing
  const shuffled = [...willing].sort(()=>Math.random()-.5);
  const activeAssigned = shuffled.slice(0, activeNeeded).map(p=>p.id);
  const shortfall = activeNeeded - activeAssigned.length;

  const result = {};
  participants.forEach(p=>{ result[p.id]='observer'; });
  activeAssigned.forEach(id=>{ result[id]='active'; });
  return {roles: result, shortfall};
}

/* ── AUTO-CALIBRATE DELAYS ────────────────────────────────────── */
function calcBaseDelays(config){
  const {stations,transit,paths}=config;
  function pathTime(k){
    const seq=paths[k].seq;let t=0;
    for(let i=1;i<seq.length;i++){
      const sid=seq[i];const s=stations[sid];
      if(!s||!s.enabled) continue;
      t+=getT(transit,seq[i-1],sid);
      if(!s.isFinal&&!s.isWaiting) t+=s.dur||0;
    }
    return t;
  }
  const keys=Object.keys(paths);
  const times={};keys.forEach(k=>times[k]=pathTime(k));
  const maxT=Math.max(...Object.values(times));
  const delays={};keys.forEach(k=>delays[k]=Math.round(maxT-times[k]));
  return delays;
}

/* ── DISPATCH ENGINE ──────────────────────────────────────────── */
async function dispatchFromS3(pid,forced=false,config=null){
  const cfg=config||(await dbGet('/config'))||DEFAULT_CONFIG;
  const p=await dbGet('/participants/'+pid);
  if(!p||(p.status!=='waiting_s3'&&p.status!=='s3_holding')) return;
  const path=cfg.paths[p.path];if(!path) return;
  const nextIdx=(p.stepIndex??0)+1;
  if(nextIdx>=path.seq.length) return;

  // Find next enabled station
  let targetIdx=nextIdx;
  while(targetIdx<path.seq.length){
    const sid=path.seq[targetIdx];
    const s=cfg.stations[sid];
    if(s&&s.enabled) break;
    targetIdx++;
  }
  if(targetIdx>=path.seq.length) return;

  const fromSid='s3',toSid=path.seq[targetIdx];
  const toSt=cfg.stations[toSid];if(!toSt) return;
  const tDur=getT(cfg.transit,fromSid,toSid);
  const delays=calcBaseDelays(cfg);

  if(!forced){
    const earliest=(p.registeredAt||now())+(delays[p.path]||0)*1000;
    if(now()<earliest){
      await dbUpdate('/participants/'+pid,{status:'s3_holding',holdUntil:earliest});
      setTimeout(()=>dispatchFromS3(pid,true,cfg),earliest-now()+100);
      return;
    }
  }

  const cap=stCap(toSt);
  if(!toSt.isWaiting&&(toSt.activeRoles||0)+(toSt.observerRoles||0)===1){
    const soloFreeAt=(await dbGet('/soloFreeAt/'+toSid))||0;
    const arrivalTime=now()+tDur*1000;
    if(!forced&&arrivalTime<soloFreeAt-5000){
      await dbUpdate('/participants/'+pid,{status:'s3_holding',holdUntil:soloFreeAt-tDur*1000});
      setTimeout(()=>dispatchFromS3(pid,true,cfg),Math.max(100,soloFreeAt-tDur*1000-now()));
      return;
    }
    await dbSet('/soloFreeAt/'+toSid,arrivalTime+toSt.dur*1000);
  }

  await dbTx('/occupancy/s3',v=>Math.max(0,(v||0)-1));
  await dbUpdate('/participants/'+pid,{
    status:'transit',transitStartedAt:now(),transitDur:tDur,transitTo:toSid,
    transitToName:toSt.name,
    stepIndex:targetIdx,currentStation:null,stationStartedAt:null,
    holdUntil:null,instruction:`Proceed to ${toSt.name}.`,instructionAt:now(),checkedIn:false,assignedRole:null,
  });
  setTimeout(()=>handleArrival(pid,toSid,cfg),tDur*1000+200);
}

async function handleArrival(pid,sid,config=null){
  const cfg=config||(await dbGet('/config'))||DEFAULT_CONFIG;
  const p=await dbGet('/participants/'+pid);
  if(!p||p.transitTo!==sid) return;
  const s=cfg.stations[sid];if(!s) return;
  await dbUpdate('/participants/'+pid,{
    status:'arrived',currentStation:sid,transitTo:null,transitStartedAt:null,transitDur:null,
    instruction:`You have arrived at ${s.name}.\nWait for check-in.`,instructionAt:now(),checkedIn:false,
  });
  await dbTx('/occupancy/'+sid,v=>(v||0)+1);
}

async function advanceParticipant(pid,cfg=null){
  const config=cfg||(await dbGet('/config'))||DEFAULT_CONFIG;
  const p=await dbGet('/participants/'+pid);
  if(!p||p.status==='done') return;
  const path=config.paths[p.path];if(!path) return;
  const curIdx=p.stepIndex??0,nextIdx=curIdx+1;
  if(p.currentStation) await dbTx('/occupancy/'+p.currentStation,v=>Math.max(0,(v||0)-1));
  if(nextIdx>=path.seq.length){
    await dbUpdate('/participants/'+pid,{status:'done',currentStation:null,stationStartedAt:null,
      instruction:'Your experience has concluded.',instructionAt:now()});
    return;
  }
  // Find next enabled
  let targetIdx=nextIdx;
  while(targetIdx<path.seq.length){
    const sid=path.seq[targetIdx];
    const s=config.stations[sid];
    if(s&&s.enabled) break;
    targetIdx++;
  }
  if(targetIdx>=path.seq.length){
    await dbUpdate('/participants/'+pid,{status:'done',currentStation:null,stationStartedAt:null,
      instruction:'Your experience has concluded.',instructionAt:now()});
    return;
  }
  const fromSid=path.seq[curIdx],toSid=path.seq[targetIdx];
  const toSt=config.stations[toSid];if(!toSt) return;
  const tDur=getT(config.transit,fromSid,toSid);
  const cap=stCap(toSt);
  if(!toSt.isWaiting&&cap===1){
    const soloFreeAt=(await dbGet('/soloFreeAt/'+toSid))||0;
    const arrivalTime=now()+tDur*1000;
    if(arrivalTime<soloFreeAt-5000){
      const s3occ=(await dbGet('/occupancy/s3'))||0;
      if(s3occ<stCap(config.stations.s3||{observerRoles:10})){
        await dbTx('/occupancy/s3',v=>(v||0)+1);
        await dbUpdate('/participants/'+pid,{status:'s3_holding',currentStation:'s3',stationStartedAt:null,
          stepIndex:curIdx,holdUntil:soloFreeAt-tDur*1000,transitTo:null,
          instruction:'Please take a seat and wait for your appointment.',instructionAt:now()});
        setTimeout(()=>dispatchFromS3(pid,true,config),Math.max(100,soloFreeAt-tDur*1000-now()));
        await addNotif(pid,`${pid} → Waiting Room (${toSt.name} busy)`,'warn');
        return;
      }
    }
    await dbSet('/soloFreeAt/'+toSid,now()+tDur*1000+toSt.dur*1000);
  }
  await dbUpdate('/participants/'+pid,{
    status:'transit',transitStartedAt:now(),transitDur:tDur,transitTo:toSid,
    transitToName:toSt.name,
    stepIndex:targetIdx,currentStation:null,stationStartedAt:null,
    instruction:`Proceed to ${toSt.name}.`,instructionAt:now(),checkedIn:false,assignedRole:null,
  });
  setTimeout(()=>handleArrival(pid,toSid,config),tDur*1000+200);
}

async function addNotif(pid,msg,type='info'){
  await fdb.ref('/notifications/'+now()+Math.random()).set({pid,msg,time:now(),type});
}

async function removeParticipant(pid){
  const p=await dbGet('/participants/'+pid);
  if(p?.currentStation) await dbTx('/occupancy/'+p.currentStation,v=>Math.max(0,(v||0)-1));
  await fdb.ref('/participants/'+pid).remove();
  const notifs=await dbGet('/notifications')||{};
  for(const [nid,n] of Object.entries(notifs)){if(n?.pid===pid) await fdb.ref('/notifications/'+nid).remove();}
}

/* ── BEGIN SESSION (performer clicks) ────────────────────────── */
async function beginSession(sid, checkedInPids, config=null){
  const cfg=config||(await dbGet('/config'))||DEFAULT_CONFIG;
  const s=cfg.stations[sid];if(!s) return;

  // Load participant data for role assignment
  const pData=[];
  for(const pid of checkedInPids){
    const p=await dbGet('/participants/'+pid);
    if(p) pData.push(p);
  }

  const {roles,shortfall}=assignRoles(pData,s);

  // Notify admin if shortfall
  if(shortfall>0){
    await addNotif(null,`${s.name}: needs ${shortfall} more willing active participant(s). Session started anyway.`,'warn');
  }

  const t=now();
  for(const p of pData){
    const role=roles[p.id]||'observer';
    const msg=role==='active'?s.messageActive:s.messageObserver;
    await dbUpdate('/participants/'+p.id,{
      status:'active',
      stationStartedAt:t,
      assignedRole:role,
      instruction:msg||`Session started at ${s.name}.`,
      instructionAt:t,
    });
  }

  if(s.dur>0){
    setTimeout(async()=>{
      for(const p of pData) await addNotif(p.id,`${p.id} — time up · ${s.name}`,'warn');
    },s.dur*1000);
  }
}

/* ── HOOKS ────────────────────────────────────────────────────── */
function useFirebase(path){
  const [val,setVal]=useState(null);
  useEffect(()=>{const ref=fdb.ref(path);ref.on('value',s=>setVal(s.val()));return()=>ref.off();},[path]);
  return val;
}
function useToast(){
  const [ts,setTs]=useState([]);
  const add=useCallback((msg,type='ok')=>{const id=now();setTs(t=>[...t,{id,msg,type}]);setTimeout(()=>setTs(t=>t.filter(x=>x.id!==id)),3400);},[]);
  return{ts,add};
}

/* ── TIMER BAR ────────────────────────────────────────────────── */
function TimerBar({startedAt,dur}){
  const [,setT]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setT(x=>x+1),1000);return()=>clearInterval(t);},[]);
  if(!startedAt||!dur) return null;
  const el=Math.floor((now()-startedAt)/1000),pct=Math.min(100,(el/dur)*100),rem=Math.max(0,dur-el),over=el>dur;
  const col=over?'var(--red)':pct>80?'var(--amber)':'var(--green)';
  return(<div><div className="tbar"><div className="tfill" style={{width:pct+'%',background:col}}/></div><div className="tlabel"><span style={{color:col}}>{over?'+':''}{fmtSec(el)}</span><span style={{color:rem<30?'var(--red)':undefined}}>{fmtSec(rem)}</span></div></div>);
}

/* ── OVERVIEW TAB ─────────────────────────────────────────────── */
function OverviewTab({pList,occupancy,notifList,finishAndAdvance,clearNotif,doRemove,config,toast}){
  const [,setT]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setT(x=>x+1),1000);return()=>clearInterval(t);},[]);
  const stations=config.stations||DEFAULT_CONFIG.stations;
  const s3ppl=pList.filter(p=>p.status==='waiting_s3'||p.status==='s3_holding');
  const delays=useMemo(()=>calcBaseDelays(config),[config]);

  return(
    <div className="g2">
      <div>
        <div className="panel mb14">
          <div className="ph"><span className="pt">Stations · live</span></div>
          <div className="pb">
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(100px,1fr))',gap:7}}>
              {Object.values(stations).filter(s=>s.enabled).map(station=>{
                const occ=occupancy[station.id]||0;
                const cap=stCap(station);
                const full=occ>=cap;
                const arrived=pList.filter(p=>p.status==='arrived'&&p.currentStation===station.id).length;
                const stPpl=pList.filter(p=>p.currentStation===station.id&&p.status==='active');
                return(
                  <div key={station.id} className={`scard ${full?'full':occ>0?'act':''}`}>
                    <div className="sname">S{station.num}</div>
                    <div className="socc" style={{color:full?'var(--red)':occ>0?'var(--green)':'var(--t3)'}}>{occ}</div>
                    <div className="scap">/{cap} {station.activeRoles>0&&<span style={{color:'var(--amber)',fontSize:8}}>({station.activeRoles}A)</span>}</div>
                    {arrived>0&&<div style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--amber)',marginTop:2}}>{arrived} arrived</div>}
                    <div className="pbar"><div className="pfill" style={{width:`${Math.min(100,(occ/cap)*100)}%`,background:full?'var(--red)':'var(--green)'}}/></div>
                    {stPpl[0]?.stationStartedAt&&station.dur>0&&<TimerBar startedAt={stPpl[0].stationStartedAt} dur={station.dur}/>}
                  </div>
                );
              })}
            </div>
          </div>
        </div>

        <div className="panel mb14">
          <div className="ph">
            <span className="pt">Waiting Room ({s3ppl.length}/{stCap(stations.s3||{observerRoles:10})})</span>
            <span className="dim">delays: {Object.entries(delays).map(([k,v])=>`${k}:${fmtSec(v)}`).join(' · ')}</span>
          </div>
          <div className="pb">
            {s3ppl.length===0&&<div className="dim" style={{textAlign:'center',padding:'10px 0'}}>Empty</div>}
            {s3ppl.map(p=>{
              const path=config.paths?.[p.path];
              const nextSid=path?.seq[(p.stepIndex??0)+1];
              const nextSt=nextSid?stations[nextSid]:null;
              const isHolding=p.status==='s3_holding';
              const rem=isHolding&&p.holdUntil?Math.max(0,Math.round((p.holdUntil-now())/1000)):0;
              return(
                <div key={p.id} className="wslot">
                  <div className="row">
                    <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text)'}}>{p.id}</span>
                    <span className={`badge ${p.path==='A'?'bg-b':p.path==='B'?'bg-p':'bg-a'}`}>{p.path}</span>
                    <span className={`role-pill ${p.rolePreference==='active'?'role-active':'role-observer'}`}>{p.rolePreference==='active'?'active':'observer'}</span>
                    {nextSt&&<span className="dim">→{nextSt.name}</span>}
                    {isHolding&&rem>0&&<span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--amber)'}}>⏳{fmtSec(rem)}</span>}
                  </div>
                  <div className="row" style={{gap:4}}>
                    {isHolding
                      ?<button className="btn ba sm" onClick={()=>{dispatchFromS3(p.id,true,config);toast.add(p.id+' forced','ok');}}>Force →</button>
                      :<button className="btn bg sm" onClick={()=>{dispatchFromS3(p.id,false,config);toast.add(p.id+' sent','ok');}}>Send →</button>}
                    <button className="btn br sm" onClick={()=>doRemove(p.id)}>✕</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Arrived waiting for begin */}
        {Object.values(stations).filter(s=>s.enabled&&!s.isWaiting).map(station=>{
          const arrivedHere=pList.filter(p=>p.status==='arrived'&&p.currentStation===station.id);
          const inTransit=pList.filter(p=>p.status==='transit'&&p.transitTo===station.id);
          if(arrivedHere.length===0&&inTransit.length===0) return null;
          const cap=stCap(station);
          const willingness=arrivedHere.filter(p=>p.rolePreference==='active').length;
          return(
            <div key={station.id} className="panel mb14" style={{borderColor:'rgba(255,170,0,.25)'}}>
              <div className="ph">
                <span className="pt" style={{color:'var(--amber)'}}>{station.name} · {arrivedHere.length}/{cap} checked in</span>
                <span className="dim">{inTransit.length} in transit · {willingness} willing active</span>
              </div>
              <div className="pb">
                <div className="row" style={{gap:5,flexWrap:'wrap',marginBottom:8}}>
                  {arrivedHere.map(p=>(
                    <span key={p.id} className={`role-pill ${p.rolePreference==='active'?'role-active':'role-observer'}`}>
                      {p.id} {p.rolePreference==='active'?'●':'○'}
                    </span>
                  ))}
                  {inTransit.map(p=>{
                    const rem=p.transitStartedAt?Math.max(0,p.transitDur-Math.floor((now()-p.transitStartedAt)/1000)):0;
                    return<span key={p.id} className="badge bg-b">{p.id} ✈{fmtSec(rem)}</span>;

                <div className="dim" style={{marginBottom:6}}>

                </div>
              </div>
            </div>
          );
        })}
      </div>

      <div>
        <div className="panel">
          <div className="ph">
            <span className="pt" style={{color:notifList.some(n=>n.type==='warn')?'var(--amber)':undefined}}>
              Notifications {notifList.length>0&&`(${notifList.length})`}
            </span>
            {notifList.length>0&&<button className="btn bx sm" onClick={()=>fdb.ref('/notifications').remove()}>Clear</button>}
          </div>
          <div className="pb scroll">
            {notifList.length===0&&<div className="dim" style={{textAlign:'center',padding:'12px 0'}}>None</div>}
            {notifList.map(n=>(
              <div key={n.id} className="notif">
                <div><div className="ntxt">{n.msg}</div><div className="dim">{new Date(n.time).toLocaleTimeString('en')}</div></div>
                <div className="row" style={{gap:5}}>

                  <button className="btn bx sm" onClick={()=>clearNotif(n.id)}>✕</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

              </div>
              <div style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.instruction||'—'}</div>
              <input value={instructions[p.id]||''} onChange={e=>setInstructions(prev=>({...prev,[p.id]:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&send(p.id)} placeholder="New instruction..." style={{fontSize:9,padding:'5px 8px'}}/>
              <button className="btn bg sm" onClick={()=>send(p.id)}>Send</button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── ALLOWED IDs TAB ──────────────────────────────────────────── */
function AllowedIdsTab({toast}){
  const allowedIds=useFirebase('/allowedIds')||{};
  const [newId,setNewId]=useState('');
  const [bulkText,setBulkText]=useState('');
  const idList=Object.keys(allowedIds).sort();
  const addId=async()=>{const id=newId.trim().toUpperCase();if(!id){toast.add('Enter ID','err');return;}await dbSet('/allowedIds/'+id,true);toast.add(`${id} added`,'ok');setNewId('');};
  const addBulk=async()=>{const ids=bulkText.split(/[\n,\s]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);if(!ids.length){toast.add('No IDs','err');return;}for(const id of ids)await dbSet('/allowedIds/'+id,true);toast.add(`${ids.length} IDs added`,'ok');setBulkText('');};
  const removeId=async(id)=>{await fdb.ref('/allowedIds/'+id).remove();toast.add(`${id} removed`,'ok');};
  const clearAll=async()=>{if(!window.confirm('Remove all?')) return;await fdb.ref('/allowedIds').remove();toast.add('Cleared','ok');};
  return(
    <div>
      <div className="panel mb14">
        <div className="ph"><span className="pt">Add ID</span></div>
        <div className="pb">
          <div className="row mb8"><input value={newId} onChange={e=>setNewId(e.target.value.toUpperCase())} onKeyDown={e=>e.key==='Enter'&&addId()} placeholder="e.g. 4K97WP" maxLength={16} style={{maxWidth:200}}/><button className="btn bg" onClick={addId}>+ Add</button></div>
        </div>
      </div>
      <div className="panel mb14">
        <div className="ph"><span className="pt">Bulk Add</span><span className="dim">one per line or comma-separated</span></div>
        <div className="pb"><textarea rows={4} value={bulkText} onChange={e=>setBulkText(e.target.value)} placeholder={'4K97WP\nB35RD2\n...'} style={{marginBottom:8}}/><button className="btn bg" style={{width:'100%'}} onClick={addBulk}>Add All →</button></div>
      </div>
      <div className="panel">
        <div className="ph"><span className="pt">Allowed IDs ({idList.length})</span>{idList.length>0&&<button className="btn br sm" onClick={clearAll}>Clear All</button>}</div>
        <div className="pb scroll">
          {idList.length===0&&<div className="dim" style={{textAlign:'center',padding:'12px 0'}}>None</div>}
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {idList.map(id=>(
              <div key={id} style={{display:'flex',alignItems:'center',gap:4,background:'var(--bg3)',border:'1px solid var(--line)',borderRadius:3,padding:'3px 8px'}}>
                <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--text)'}}>{id}</span>
                <button onClick={()=>removeId(id)} style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer',fontSize:10,padding:'0 2px'}}>✕</button>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── CONFIG TAB ───────────────────────────────────────────────── */
function ConfigTab({config,toast}){
  const [cfg,setCfg]=useState(null);
  useEffect(()=>{if(config)setCfg(JSON.parse(JSON.stringify(config)));},[config]);
  if(!cfg) return <div className="dim" style={{padding:20}}>Loading...</div>;

  const saveConfig=async()=>{await dbSet('/config',cfg);toast.add('Config saved','ok');};
  const resetConfig=async()=>{if(!window.confirm('Reset to defaults?')) return;await dbSet('/config',DEFAULT_CONFIG);toast.add('Reset','ok');};

  const updateStation=(id,field,val)=>{
    setCfg(prev=>{
      const updated={...prev.stations[id],[field]:['activeRoles','observerRoles','dur'].includes(field)?+val:val};
      // Auto-set type label for display
      return{...prev,stations:{...prev.stations,[id]:updated}};
    });
  };

  const updateTransit=(key,val)=>setCfg(prev=>({...prev,transit:{...prev.transit,[key]:+val}}));

  const updatePathSeq=(pathKey,idx,val)=>{
    setCfg(prev=>{const newSeq=[...prev.paths[pathKey].seq];newSeq[idx]=val;return{...prev,paths:{...prev.paths,[pathKey]:{...prev.paths[pathKey],seq:newSeq}}};});
  };
  const addPathStep=(pathKey)=>setCfg(prev=>({...prev,paths:{...prev.paths,[pathKey]:{...prev.paths[pathKey],seq:[...prev.paths[pathKey].seq,'s1']}}}));
  const removePathStep=(pathKey,idx)=>setCfg(prev=>({...prev,paths:{...prev.paths,[pathKey]:{...prev.paths[pathKey],seq:prev.paths[pathKey].seq.filter((_,i)=>i!==idx)}}}));

  const stations=cfg.stations||{};
  const paths=cfg.paths||{};
  const transit=cfg.transit||{};
  const delays=calcBaseDelays(cfg);

  return(
    <div>
      <div className="row-b mb16">
        <div className="dim">Edit stations, paths, messages. Auto-saves delays on save.</div>
        <div className="row" style={{gap:6}}>
          <button className="btn bx sm" onClick={resetConfig}>Reset defaults</button>
          <button className="btn bg" onClick={saveConfig}>Save Config</button>
        </div>
      </div>

      {/* STATIONS */}
      <div className="panel mb14">
        <div className="ph"><span className="pt">Stations</span><span className="dim">type = solo if 1 active+0 observer, group otherwise</span></div>
        <div className="pb">
          {Object.values(stations).map(s=>{
            const cap=stCap(s);
            const type=cap===1?'solo':s.isWaiting?'waiting':s.isFinal?'finale':'group';
            return(
              <div key={s.id} className="panel mb8" style={{background:'var(--bg3)'}}>
                <div style={{display:'grid',gridTemplateColumns:'auto 1fr repeat(4,70px) auto',gap:8,alignItems:'center',padding:'8px 12px'}}>
                  <input type="checkbox" checked={s.enabled!==false} onChange={e=>updateStation(s.id,'enabled',e.target.checked)} style={{width:14,height:14}}/>
                  <input value={s.name} onChange={e=>updateStation(s.id,'name',e.target.value)} style={{fontSize:10,padding:'4px 7px'}} disabled={s.isWaiting||s.isFinal}/>
                  <div style={{textAlign:'center'}}>
                    <div className="dim" style={{marginBottom:2}}>Active</div>
                    <input type="number" value={s.activeRoles||0} min={0} max={30} onChange={e=>updateStation(s.id,'activeRoles',e.target.value)} style={{fontSize:10,padding:'4px 6px',textAlign:'center'}} disabled={s.isWaiting||s.isFinal}/>
                  </div>
                  <div style={{textAlign:'center'}}>
                    <div className="dim" style={{marginBottom:2}}>Observers</div>
                    <input type="number" value={s.observerRoles||0} min={0} max={30} onChange={e=>updateStation(s.id,'observerRoles',e.target.value)} style={{fontSize:10,padding:'4px 6px',textAlign:'center'}} disabled={s.isWaiting||s.isFinal}/>
                  </div>
                  <div style={{textAlign:'center'}}>
                    <div className="dim" style={{marginBottom:2}}>Dur (s)</div>
                    <input type="number" value={s.dur} min={0} onChange={e=>updateStation(s.id,'dur',e.target.value)} style={{fontSize:10,padding:'4px 6px',textAlign:'center'}} disabled={s.isWaiting||s.isFinal}/>
                  </div>
                  <div style={{textAlign:'center'}}>
                    <div className="dim" style={{marginBottom:2}}>Cap/Type</div>
                    <span className={`badge ${type==='solo'?'bg-b':type==='group'?'bg-p':type==='waiting'?'bg-a':'bg-x'}`}>{cap} · {type}</span>
                  </div>
                  <span className={`badge ${s.enabled!==false?'bg-g':'bg-x'}`}>{s.enabled!==false?'on':'off'}</span>
                </div>
                {!s.isWaiting&&!s.isFinal&&s.activeRoles>0&&(
                  <div style={{padding:'0 12px 10px',display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                    <div>
                      <div className="dim" style={{marginBottom:3}}>Message — Active role</div>
                      <textarea rows={2} value={s.messageActive||''} onChange={e=>updateStation(s.id,'messageActive',e.target.value)} style={{fontSize:9,padding:'5px 8px'}}/>
                    </div>
                    <div>
                      <div className="dim" style={{marginBottom:3}}>Message — Observer role</div>
                      <textarea rows={2} value={s.messageObserver||''} onChange={e=>updateStation(s.id,'messageObserver',e.target.value)} style={{fontSize:9,padding:'5px 8px'}}/>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      {/* PATHS */}
      <div className="panel mb14">
        <div className="ph"><span className="pt">Paths</span></div>
        <div className="pb">
          {Object.entries(paths).map(([pathKey,path])=>(
            <div key={pathKey} className="mb16">
              <div className="row mb8">
                <span className={`badge ${pathKey==='A'?'bg-b':pathKey==='B'?'bg-p':'bg-a'}`}>{pathKey}</span>
                <span className="dim">base delay: {fmtSec(delays[pathKey]||0)}</span>
                <button className="btn bg sm" onClick={()=>addPathStep(pathKey)}>+ Step</button>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:4}}>
                {path.seq.map((sid,i)=>(
                  <div key={i} style={{display:'flex',alignItems:'center',gap:6}}>
                    <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t3)',minWidth:20,textAlign:'right'}}>{i+1}.</span>
                    <select value={sid} onChange={e=>updatePathSeq(pathKey,i,e.target.value)} style={{fontSize:10,padding:'4px 6px',flex:1,maxWidth:160}}>
                      {Object.values(stations).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
                    </select>
                    <button onClick={()=>{
                      if(i===0) return;
                      setCfg(prev=>{
                        const seq=[...prev.paths[pathKey].seq];
                        [seq[i-1],seq[i]]=[seq[i],seq[i-1]];
                        return{...prev,paths:{...prev.paths,[pathKey]:{...prev.paths[pathKey],seq}}};
                      });
                    }} disabled={i===0} style={{background:'none',border:'1px solid var(--line2)',color:i===0?'var(--t3)':'var(--t2)',cursor:i===0?'not-allowed':'pointer',borderRadius:2,padding:'2px 6px',fontFamily:'var(--mono)',fontSize:10}}>↑</button>
                    <button onClick={()=>{
                      if(i===path.seq.length-1) return;
                      setCfg(prev=>{
                        const seq=[...prev.paths[pathKey].seq];
                        [seq[i],seq[i+1]]=[seq[i+1],seq[i]];
                        return{...prev,paths:{...prev.paths,[pathKey]:{...prev.paths[pathKey],seq}}};
                      });
                    }} disabled={i===path.seq.length-1} style={{background:'none',border:'1px solid var(--line2)',color:i===path.seq.length-1?'var(--t3)':'var(--t2)',cursor:i===path.seq.length-1?'not-allowed':'pointer',borderRadius:2,padding:'2px 6px',fontFamily:'var(--mono)',fontSize:10}}>↓</button>
                    {path.seq.length>2&&<button onClick={()=>removePathStep(pathKey,i)} style={{background:'none',border:'none',color:'var(--red)',cursor:'pointer',fontSize:12,padding:'2px 4px'}}>×</button>}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* TRANSIT */}
      <div className="panel mb14">
        <div className="ph"><span className="pt">Transit times (seconds)</span></div>
        <div className="pb">
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
            {Object.entries(transit).map(([key,val])=>(
              <div key={key} className="row">
                <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--t2)',minWidth:90}}>{key.toUpperCase().replace('-',' → ')}</span>
                <input type="number" value={val} min={0} onChange={e=>updateTransit(key,e.target.value)} style={{fontSize:10,padding:'4px 6px',width:65}}/>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* SETTINGS */}
      <div className="panel">
        <div className="ph"><span className="pt">Show settings</span></div>
        <div className="pb">
          <div className="g3">
            <div><label>Max participants</label><input type="number" value={cfg.maxParticipants||30} min={1} max={100} onChange={e=>setCfg(prev=>({...prev,maxParticipants:+e.target.value}))}/></div>
            <div><label>Avg. registration pace (s) — used for dispatch timing</label><input type="number" value={cfg.regInterval||60} min={10} onChange={e=>setCfg(prev=>({...prev,regInterval:+e.target.value}))}/></div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── STATION INTERFACE ────────────────────────────────────────── */
function StationInterface({toast}){
  const [sel,setSel]=useState(null);
  const [selIdx,setSelIdx]=useState(0);
  const [scanVal,setScanVal]=useState('');
  const [scanFeedback,setScanFeedback]=useState('');
  const [scanning,setScanning]=useState(false);
  const [,setT]=useState(0);
  useEffect(()=>{const t=setInterval(()=>setT(x=>x+1),1000);return()=>clearInterval(t);},[]);

  const videoRef=useRef(null);
  const streamRef=useRef(null);
  const occupancy=useFirebase('/occupancy')||{};
  const participants=useFirebase('/participants')||{};
  const config=useFirebase('/config')||DEFAULT_CONFIG;
  const pList=Object.values(participants);
  const stations=config.stations||DEFAULT_CONFIG.stations;
  const stationList=Object.values(stations).filter(s=>s.enabled!==false&&!s.isWaiting);

  const handleScan=async(raw)=>{
    let id=raw.trim().toUpperCase();
    const urlMatch=id.match(/[?&]ID=([A-Z0-9]+)/);
    if(urlMatch) id=urlMatch[1];
    else id=id.split(/[^A-Z0-9]/)[0];
    if(!id||!sel) return;
    setScanVal('');
    const p=participants[id];
    if(!p){setScanFeedback(`${id} — not found`);setTimeout(()=>setScanFeedback(''),2500);return;}
    if(p.currentStation!==sel&&p.status!=='arrived'){
      setScanFeedback(`${id} — not at this station`);setTimeout(()=>setScanFeedback(''),2500);return;}
    if(p.checkedIn){setScanFeedback(`${id} — already checked in`);setTimeout(()=>setScanFeedback(''),2500);return;}
    // Mark as checked in (arrived + checkedIn=true)
    await dbUpdate('/participants/'+id,{checkedIn:true});
    setScanFeedback(`${id} ✓ checked in`);
    if('vibrate' in navigator) navigator.vibrate([60,30,60]);
    setTimeout(()=>setScanFeedback(''),2500);
  };

  const canvasRef=useRef(null);

  const startScan=async()=>{
    setScanning(true);
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
      streamRef.current=stream;
      if(videoRef.current){
        videoRef.current.srcObject=stream;
        videoRef.current.play();
        videoRef.current.style.display='block';
      }
      if('BarcodeDetector' in window){
        // Native API — Android Chrome
        const det=new BarcodeDetector({formats:['qr_code']});
        const scan=async()=>{
          if(!streamRef.current) return;
          try{
            const bc=await det.detect(videoRef.current);
            if(bc.length>0){await handleScan(bc[0].rawValue);stopScan();}
            else requestAnimationFrame(scan);
          }catch{requestAnimationFrame(scan);}
        };
        requestAnimationFrame(scan);
      } else if(typeof jsQR !== 'undefined'){
        // jsQR fallback — all browsers
        const canvas=document.createElement('canvas');
        const ctx=canvas.getContext('2d');
        const scan=()=>{
          if(!streamRef.current||!videoRef.current) return;
          const v=videoRef.current;
          if(v.readyState===v.HAVE_ENOUGH_DATA){
            canvas.width=v.videoWidth;
            canvas.height=v.videoHeight;
            ctx.drawImage(v,0,0,canvas.width,canvas.height);
            const imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
            const code=jsQR(imageData.data,imageData.width,imageData.height);
            if(code){handleScan(code.data);stopScan();return;}
          }
          requestAnimationFrame(scan);
        };
        requestAnimationFrame(scan);
      } else {
        toast.add('QR scanning not supported — type ID manually','warn');
        stopScan();
      }
    }catch{toast.add('Camera denied — type ID manually','err');setScanning(false);}
  };

  const stopScan=()=>{
    setScanning(false);
    if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}
    if(videoRef.current){videoRef.current.style.display='none';}
  };

  useEffect(()=>()=>stopScan(),[]);

  if(!sel||!stationList.length){
    return(
      <div className="sif">
        <div className="sif-hd">Select your station</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:9,maxWidth:520,width:'100%'}}>
          {stationList.map((station,i)=>{
            const occ=occupancy[station.id]||0;const cap=stCap(station);const full=occ>=cap;
            return(
              <button key={station.id} onClick={()=>{setSel(station.id);setSelIdx(i);}} style={{background:'var(--bg3)',border:`1px solid ${full?'var(--red)':occ>0?'var(--green)':'var(--line)'}`,borderRadius:4,padding:16,cursor:'pointer',fontFamily:'var(--mono)',color:'var(--text)',textAlign:'center'}}>
                <div style={{fontSize:8,color:'var(--t2)',marginBottom:5,letterSpacing:2,textTransform:'uppercase'}}>{station.name}</div>
                <div style={{fontSize:24,color:full?'var(--red)':occ>0?'var(--green)':'var(--t3)',fontWeight:300}}>{occ}</div>
                <div style={{fontSize:8,color:'var(--t3)'}}>/{cap}</div>
              </button>
            );
          })}
        </div>
      </div>
    );
  }

  const station=stations[sel];
  const cap=stCap(station);
  const occ=occupancy[sel]||0;
  const full=occ>=cap;

  // All participants at this station
  const arrivedHere=pList.filter(p=>p.currentStation===sel&&(p.status==='arrived'||p.status==='active'));
  const checkedInHere=arrivedHere.filter(p=>p.checkedIn);
  const activePpl=arrivedHere.filter(p=>p.status==='active');
  const sessionStarted=activePpl.length>0;

  const elapsed=activePpl[0]?.stationStartedAt?Math.floor((now()-activePpl[0].stationStartedAt)/1000):0;
  const pct=station.dur>0?Math.min(100,(elapsed/station.dur)*100):0;
  const over=station.dur>0&&elapsed>station.dur;

  const doBeginSession=async()=>{
    if(checkedInHere.length===0){toast.add('No one checked in yet','err');return;}
    await beginSession(sel,checkedInHere.map(p=>p.id),config);
    toast.add(`Session started — ${checkedInHere.length} participants`,'ok');
  };

  const doEndSession=async()=>{
    if(activePpl.length===0){toast.add('No active session','err');return;}
    for(const p of activePpl) await addNotif(p.id,`${p.id} finished ${station.name}`,'warn');
    if('vibrate' in navigator) navigator.vibrate([200,100,200]);
    toast.add('Admin notified','ok');
  };

  return(
    <div className="sif">
      {/* NAV */}
      <div className="sif-nav">
        <button className="sif-nav-btn" onClick={()=>{stopScan();const prev=stationList[selIdx-1];if(prev){setSel(prev.id);setSelIdx(selIdx-1);}}} disabled={selIdx===0}>← Prev</button>
        <span className="sif-station-name">{station.name}</span>
        <button className="sif-nav-btn" onClick={()=>{stopScan();const next=stationList[selIdx+1];if(next){setSel(next.id);setSelIdx(selIdx+1);}}} disabled={selIdx===stationList.length-1}>Next →</button>
      </div>

      <div style={{marginTop:56,display:'flex',flexDirection:'column',alignItems:'center',width:'100%'}}>
        <div className="sif-hd">Performer Interface</div>
        <div className="sif-name">{station.name}</div>
        <div className="sif-cap">
          {station.activeRoles>0?`${station.activeRoles} active · ${station.observerRoles} observer`:`${cap} observer`}
        </div>
        <div className="sif-occ" style={{color:full?'var(--red)':occ>0?'var(--green)':'var(--t3)'}}>{occ}</div>

        {sessionStarted&&station.dur>0&&(
          <>
            <div className="sif-timer" style={{color:over?'var(--red)':pct>80?'var(--amber)':'var(--green)'}}>{over?'+':''}{fmtSec(elapsed)} / {fmtSec(station.dur)}</div>
            <div className="sif-tbar"><div className="sif-tfill" style={{width:pct+'%',background:over?'var(--red)':pct>80?'var(--amber)':'var(--green)'}}/></div>
          </>
        )}

        {/* Participant list with roles */}
        <div style={{width:'100%',maxWidth:300,marginBottom:16}}>
          {arrivedHere.length===0&&<div className="dim" style={{textAlign:'center',padding:'8px 0'}}>No participants yet — scan QR codes</div>}
          {arrivedHere.map(p=>(
            <div key={p.id} style={{
              display:'flex',alignItems:'center',justifyContent:'space-between',
              padding:'10px 14px',marginBottom:6,borderRadius:3,
              background: p.checkedIn?'rgba(0,232,122,.06)':'var(--bg3)',
              border:`1px solid ${p.checkedIn?'rgba(0,232,122,.25)':'var(--line)'}`,
            }}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <div style={{
                  width:8,height:8,borderRadius:'50%',flexShrink:0,
                  background:p.checkedIn?'var(--green)':'var(--t3)',
                }}/>
                <span style={{fontFamily:'var(--mono)',fontSize:12,color:'var(--text)',letterSpacing:2}}>{p.id}</span>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                {p.assignedRole
                  ? <span style={{fontFamily:'var(--mono)',fontSize:9,color:p.assignedRole==='active'?'var(--green)':'var(--blue)',letterSpacing:1,textTransform:'uppercase'}}>{p.assignedRole==='active'?'● ACTIVE':'○ OBSERVER'}</span>
                  : <span className={`role-pill ${p.rolePreference==='active'?'role-active':'role-observer'}`}>
                      {p.rolePreference==='active'?'● willing active':'○ observer'}
                    </span>
                }
              </div>
            </div>
          ))}
        </div>

        {/* SCAN AREA */}
        <div className="sif-scan-area">
          <div className="sif-scan-label">Scan participant QR code</div>
          <video ref={videoRef} style={{display:'none',width:'100%',borderRadius:4,border:'1px solid #0e1822'}} playsInline muted/>
          {scanFeedback&&<div className="scan-feedback" style={{color:scanFeedback.includes('✓')?'var(--green)':'var(--red)'}}>{scanFeedback}</div>}
          <div style={{display:'flex',gap:6,marginBottom:6}}>
            {!scanning
              ?<button className="sif-btn sif-begin" style={{padding:'10px',flex:1}} onClick={startScan}>📷 Scan QR</button>
              :<button className="sif-btn" style={{padding:'10px',flex:1,color:'var(--amber)',borderColor:'var(--amber)',background:'var(--abg)'}} onClick={stopScan}>Stop</button>
            }
          </div>
          <div style={{display:'flex',gap:6}}>
            <input style={{background:'#050709',border:'1px solid #0e1822',color:'#dde4ee',textAlign:'center',fontSize:12,letterSpacing:2,padding:'8px',fontFamily:'var(--mono)',borderRadius:2,flex:1}} placeholder="or type ID" value={scanVal} onChange={e=>setScanVal(e.target.value.toUpperCase())} onKeyDown={e=>e.key==='Enter'&&handleScan(scanVal)} autoComplete="off"/>
            {scanVal&&<button className="sif-btn sif-begin" style={{padding:'8px 12px',width:'auto'}} onClick={()=>handleScan(scanVal)}>✓</button>}
          </div>
        </div>

        <div className="sif-act">
          {!sessionStarted&&(
            <button className="sif-btn sif-begin" onClick={doBeginSession} disabled={checkedInHere.length===0}>
              ▶ Begin Session ({checkedInHere.length} checked in)
            </button>
          )}
          {sessionStarted&&(
            <button className="sif-btn sif-fn" onClick={doEndSession}>
              ✕ End Session · Notify Admin
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── GUESTS TAB ───────────────────────────────────────────────── */
function GuestsTab({toast}){
  const preregistered = useFirebase('/preregistered')||{};
  const participants = useFirebase('/participants')||{};
  const guestList = Object.values(preregistered).sort((a,b)=>a.registeredAt-b.registeredAt);
  const totalParticipants = Object.keys(participants).length;

  const clearGuests = async()=>{
    if(!window.confirm('Clear all guest pre-registrations?')) return;
    await fdb.ref('/preregistered').remove();
    toast.add('Guest list cleared','ok');
  };

  const isIOS = ua => /iphone|ipad|ipod/i.test(ua||'');
  const isAndroid = ua => /android/i.test(ua||'');
  const deviceIcon = ua => isIOS(ua)?'🍎':isAndroid(ua)?'🤖':'💻';

  return(
    <div>
      <div className="g4 mb16">
        <div className="sc"><div className="sl">Pre-registered</div><div className="sv" style={{color:'var(--green)'}}>{guestList.length}</div></div>
        <div className="sc"><div className="sl">Day-of registered</div><div className="sv" style={{color:'var(--blue)'}}>{totalParticipants}</div></div>
        <div className="sc"><div className="sl">Still to arrive</div><div className="sv" style={{color:'var(--amber)'}}>{Math.max(0,guestList.length-totalParticipants)}</div></div>
        <div className="sc"><div className="sl">Willing active</div><div className="sv" style={{color:'var(--green)'}}>{guestList.filter(g=>g.rolePreference==='active').length}</div></div>
      </div>
      <div className="row mb12" style={{gap:6,flexWrap:'wrap'}}>
        {['17:00','17:15','17:30','17:45'].map(slot=>{
          const count=guestList.filter(g=>g.timeslot===slot).length;
          return <div key={slot} className="sc" style={{flex:1,minWidth:80,textAlign:'center'}}>
            <div className="sl">{slot}</div>
            <div style={{fontFamily:'var(--mono)',fontSize:18,fontWeight:300,color:count>0?'var(--text)':'var(--t3)'}}>{count}</div>
          </div>;
        })}
      </div>
      <div className="panel">
        <div className="ph">
          <span className="pt">Guest list — opened app before show ({guestList.length})</span>
          {guestList.length>0&&<button className="btn br sm" onClick={clearGuests}>Clear</button>}
        </div>
        <div className="pb scroll">
          {guestList.length===0&&<div className="dim" style={{textAlign:'center',padding:'16px 0'}}>No guests yet — share the link!</div>}
          <table className="tbl" style={{width:'100%'}}>
            <thead><tr><th>#</th><th>Nickname</th><th>Slot</th><th>Role</th><th>Device</th><th>Registered</th></tr></thead>
            <tbody>
              {guestList.map((g,i)=>(
                <tr key={i}>
                  <td className="dim">{i+1}</td>
                  <td style={{fontFamily:'var(--mono)',fontSize:11,color:'var(--text)'}}>{g.nickname}</td>
                  <td style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--green)'}}>{g.timeslot||'—'}</td>
                  <td><span className={`badge ${g.rolePreference==='active'?'bg-g':'bg-b'}`}>{g.rolePreference||'—'}</span></td>
                  <td style={{fontSize:14}}>{deviceIcon(g.userAgent)} <span className="dim" style={{fontSize:8}}>{isIOS(g.userAgent)?'iPhone':isAndroid(g.userAgent)?'Android':'Desktop'}</span></td>
                  <td className="dim">{g.registeredAt?new Date(g.registeredAt).toLocaleString('en',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):''}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
